<html>
  <head><meta charSet="UTF-8" /></head>
  <body>
    <div>
      <style>
        /* hue assigned by position */
        table tbody:nth-child(2n) {
          --h: 210;
        }
        table tbody:nth-child(2n+1) {
          --h: 35;
        }

        /* tr stripes derive from whichever --h is in scope */
        table tbody tr:nth-child(odd) {
          background: hsl(var(--h), 35%, 94%);
        }
        table tbody tr:nth-child(even) {
          background: hsl(var(--h), 40%, 88%);
        }

        /* separator border also inherits the incoming tbody's hue */
        table tbody + tbody tr:first-child td {
          border-top: 4px solid hsl(var(--h), 20%, 72%);
          padding-top: 0.5rem;
        }
        td {
          padding: 0.2em;
        }
      </style>
      <table>
        <tr>
          <th>internal<br />日付</th>
          <th>借方</th>
          <th>貸方</th>
          <th>勘定科目</th>
        </tr>

          </tr>
        </tbody>

          </tr>

            <td></td>
            <td>￥1,100</td>
            <td></td>
            <td>game:points</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
